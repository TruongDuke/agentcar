  # ---------------------------------- NAV (cloud-only, như VF5/VF8): NavAgent cloud sở hữu; KHÔNG
  # grammar edge (câu offline không match → escalate). Vẫn nằm trong caps (cloud_only) để #2-defense
  # PlanRunner NHẬN nav/route hợp lệ (không coi là cloud bịa) → is_nav route sang host, bỏ gate CAN.
  nav:
    type: nav
    cloud_only: true

# ---- POLICY per-xe ----
safety:
  - { device: window, action: open, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn mở cửa kính chứ ạ?" }
  - { device: window, action: set_level, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn chỉnh cửa kính chứ ạ?" }
  - { device: sunroof, action: open, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn mở cửa sổ trời chứ ạ?" }
  - { device: sunroof, action: set_level, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn chỉnh cửa sổ trời chứ ạ?" }
  - { device: mirror, action: fold, verdict: DENY, when: "speed_kmh >= 16", reason: "Xe đang chạy trên 16 km/h, chưa gập gương được ạ." }
  - { device: fog_light, action: turn_on, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn bật đèn sương mù chứ ạ?" }
  - { device: fog_light, action: turn_off, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn tắt đèn sương mù chứ ạ?" }
  - { device: trunk, action: open, verdict: DENY, when: "dang_chay == true", reason: "Xe đang di chuyển, chưa mở cốp được ạ." }
  - { device: frunk, action: open, verdict: DENY, when: "dang_chay == true", reason: "Xe đang di chuyển, chưa mở cốp trước được ạ." }
  - { device: charge_port, action: "*", verdict: DENY, when: "speed_kmh > 0", reason: "Xe đang di chuyển, chưa mở nắp sạc được ạ." }
  - { device: regen_brake, action: turn_on, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn bật phanh tái sinh chứ ạ?" }
  - { device: regen_brake, action: turn_off, verdict: CONFIRM, when: "dang_chay == true", reason: "Xe đang di chuyển, anh/chị chắc muốn tắt phanh tái sinh chứ ạ?" }
  - { device: scene_mode, action: camp, verdict: DENY, when: "dang_chay == true", reason: "Xe cần về số P mới bật được chế độ cắm trại ạ." }
  - { device: scene_mode, action: camp, verdict: DENY, when: "battery_pct <= 25", reason: "Pin dưới 25%, chưa bật được chế độ cắm trại ạ." }
  - { device: scene_mode, action: camp, verdict: DENY, when: "parking_brake != engaged", reason: "Cần kéo phanh tay mới bật được chế độ cắm trại ạ." }
  - { device: scene_mode, action: pet, verdict: DENY, when: "dang_chay == true", reason: "Xe cần về số P mới bật được chế độ thú cưng ạ." }
  - { device: scene_mode, action: pet, verdict: DENY, when: "battery_pct <= 25", reason: "Pin dưới 25%, chưa bật được chế độ thú cưng ạ." }
  - { device: scene_mode, action: pet, verdict: DENY, when: "parking_brake != engaged", reason: "Cần kéo phanh tay mới bật được chế độ thú cưng ạ." }
  - { device: scene_mode, action: wash, verdict: DENY, when: "dang_chay == true", reason: "Xe cần về số P mới bật được chế độ rửa xe ạ." }
  - { device: scene_mode, action: wash, verdict: DENY, when: "charging == true", reason: "Xe đang cắm sạc, chưa bật được chế độ rửa xe ạ." }

# ---------------------------------------------------------------- CHUẨN NGHIỆM THU
# Hai tài liệu nghiệm thu MÂU THUẪN nhau ở ba điểm. Chốt 29/09: theo QC.
#
#   test report của QC  (VITA-GRAMMAR-API-TESTREPORT-2509.xlsx)
#   UC của BA           ([WIP][S6] 22092026_Capability.xlsx, sheet 3.1/3.2)
#
# Đổi giá trị ở đây là đổi bên nào thắng — KHÔNG sửa rải rác trong code.
# `tools/check_uc.py` chấm theo BA, nên khi để "qc" thì nó sẽ báo trượt ở đúng
# mấy luật này; đó là bình thường, không phải hồi quy.
policy:
  # "Mở cửa sổ trời 200%" (dải 1..100)
  #   qc → gửi lệnh với value=200 y như người dùng nói  (QC Sunroof E197)
  #   ba → không gửi lệnh, báo dải hợp lệ               (BA 3.1 #1, ô D4)
  gia_tri_ngoai_dai: qc

  # "Đừng bật sấy kính"
  #   qc → đảo thành TẮT sấy kính                       (QC defrost E268, 684 câu)
  #   ba → không làm gì                                  (368 câu QC khác lại mong thế này)
  phu_dinh: qc

  # "giảm quạt 0 mức" / "giảm điều hòa -2 độ"
  #   qc → gửi lệnh với bước đúng như đã nói             (QC volume E166)
  #   ba → hỏi lại hoặc báo dải                          (BA 3.1 #12-#14)
  buoc_khong_duong: qc

# Tầng [1b] — model NLU trên xe (joint-nlu-trained). Chỉ chạy khi tầng luật bó tay.
nlu:
  # Model luôn gán một nhãn gì đó, không có lớp "đây không phải lệnh" — nên câu
  # tán gẫu ("cái quạt ở nhà hỏng rồi") cũng ra lệnh.
  #
  # 0.8 (30/09) quét trên 96 câu phải-im + 216 golden — bộ curated quá nhỏ và quá
  # sạch, không có tiếng lóng hay trộn Anh-Việt, đúng chỗ model chấm thấp mà vẫn
  # đúng. Áp lên 24.851 câu thật thì 54,9% số câu edge bỏ sót là do CHÍNH NGƯỠNG
  # NÀY chặn, không phải do model dốt.
  #
  # Quét lại trên 5.000 câu thật, so 0.8 với 0.65: mọi trường +0,8..+1,9 điểm,
  # đổi lấy đúng 2 câu ra lệnh oan thêm (16 -> 18 trên 137). Đường cong TRƠN,
  # không có điểm gãy — nên đây là chọn đánh đổi, không phải tìm giá trị đúng.
  #
  # Con số này chưa chốt được cho tới khi biết TỶ LỆ THẬT của câu-không-phải-lệnh
  # khi lái xe. Bộ đo đang giả định ~5% (137/2.637) nhưng đó là tỷ lệ QC soạn ra.
  nguong: 0.8

gate:
  enabled: false
  min_tokens: 2
  deadline_ms: 1200
