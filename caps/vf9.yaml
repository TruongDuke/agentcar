version: 3
model: VF9
locales: [vi]

devices:

  # ---------------------------------- CLIMATE
  hvac:
    type: hvac
    # BA sheet 3.2 ô O5: với lệnh MỨC nhiệt độ, "bên trái" = khu lái, "bên phải" =
    # khu khách. Với bật/tắt và HVAC tự động (ô P4, P6) thì trái/phải KHÔNG hợp lệ,
    # nên chỉ khai cho nhóm level — nhóm khác vẫn rơi vào VA_INVALID_ZONE.
    zone_alias:
      level: { left: driver, right: passenger }
    zones: [all, driver, passenger, rear]
    default_zone: all
    value: { default_unit: celsius, units: { celsius: { lo: 16, hi: 32, resolution: 0.5, nudge: 2, comfort_default: 22 }, fahrenheit: { lo: 61, hi: 90, resolution: 1, nudge: 4, comfort_default: 72 } } }
    modes: [auto, max, sync, ionizer]
    default_action: turn_on
    readable: true

  fan:
    type: fan
    zones: [all, front, rear]
    default_zone: all
    value: { default_unit: level, units: { level: { lo: 1, hi: 6, nudge: 1, comfort_default: 3, zero_is_off: true } } }
    modes: [blow_face, blow_feet, blow_face_feet, blow_windshield, blow_feet_windshield, recirc, fresh, intake_auto]
    default_action: turn_on
    readable: true

  defrost:
    type: defrost
    zones: [all, front, rear]
    default_zone: all
    default_action: turn_on
    readable: true

  # ---------------------------------- CỬA / KÍNH / CỐP
  window:
    type: window
    zones: [all, driver, passenger, rear_left, rear_right]
    default_zone: all
    value: { default_unit: percent, units: { percent: { lo: 1, hi: 100, resolution: 20, nudge: 20, comfort_default: 50 } } }
    readable: true
    safety_gated: true

  sunroof:
    type: sunroof
    zones: [glass, curtain]
    default_zone: glass
    value: { default_unit: percent, units: { percent: { lo: 1, hi: 100, nudge: 20, comfort_default: 50 } } }
    readable: true
    safety_gated: true

  trunk:
    type: trunk
    names: { vi: ["cốp xe", "thùng xe", "nắp cốp", "khóa cốp", "cốp sau"] }
    zones: [all, rear]
    default_zone: all
    readable: true
    safety_gated: true

  frunk:
    type: frunk
    default_action: open
    # BA chốt 28/09: VF9 CÓ cốp trước (Capability sheet 3.2, ô M14 — cốp hỗ trợ
    # vùng Trước và Sau). Trước đó khai support:false nên "mở cốp trước" bị trả
    # VA_NOT_SUPPORT. "Mở cốp" trống vùng vẫn về trunk (cốp sau), đúng mặc định BA.
    # Luật an toàn khai ở mục `safety` bên dưới, y như trunk.

  charge_port:
    type: charge_port
    default_action: open
    readable: true
    safety_gated: true

  # ---------------------------------- GƯƠNG / ĐÈN
  mirror:
    type: mirror
    actions: { exclude: [adjust] }
    zones: [all, driver, passenger]
    default_zone: all
    readable: true
    safety_gated: true

  fog_light:
    type: fog_light
    zones: [all, front, rear]
    default_zone: all
    default_action: turn_on
    readable: true
    safety_gated: true

  auto_highbeam:
    type: auto_highbeam
    default_action: turn_on
    support: false

  ambient_light:
    type: ambient_light
    actions: { exclude: [fx_none] }
    value: { default_unit: percent, units: { percent: { lo: 1, hi: 100, nudge: 20, comfort_default: 60 } } }
    modes: [amb_white, amb_dark_red, amb_red, amb_orange_red, amb_dark_yellow, amb_yellow, amb_light_yellow, amb_dark_green, amb_green, amb_light_green, amb_dark_blue, amb_blue, amb_light_blue, amb_dark_pink, amb_pink, amb_light_pink, amb_dark_orange, amb_orange, amb_light_orange, amb_dark_purple, amb_purple, amb_light_purple, amb_brown, fx_none, fx_blinking, fx_wave, fx_morse]
    default_action: turn_on
    readable: true

  # ---------------------------------- GHẾ
  seat_heating:
    type: seat_heating
    zones: [all, driver, passenger, rear_left, rear_right, rear]
    default_zone: all
    value: { default_unit: level, units: { level: { lo: 1, hi: 3, nudge: 1, comfort_default: 2, zero_is_off: true } } }
    default_action: turn_on
    readable: true

  seat_cooling:
    type: seat_cooling
    zones: [all, driver, passenger, rear_left, rear_right, rear]
    default_zone: all
    value: { default_unit: level, units: { level: { lo: 1, hi: 3, nudge: 1, comfort_default: 2, zero_is_off: true } } }
    default_action: turn_on
    readable: true

  seat_massage:
    type: seat_massage
    zones: [all, driver, passenger, rear_left, rear_right, rear]
    default_zone: all
    value: { default_unit: level, units: { level: { lo: 1, hi: 3, nudge: 1, comfort_default: 2, zero_is_off: true } } }
    modes: [msg_cat_paw, msg_wave, msg_relieve, msg_jump, msg_cross]
    default_action: turn_on
    readable: true

  # ---------------------------------- SCENE MODE
  scene_mode:
    type: scene_mode
    modes: [camp, pet, wash, reduce_chime]
    readable: true

  # ---------------------------------- MISC
  foot_kick:
    type: foot_kick
    names: { vi: ["đá cốp", "cảm biến đá cốp", "mở cốp rảnh tay bằng chân"] }
    default_action: turn_on
    readable: true

  regen_brake:
    type: regen_brake
    modes: [regen_low, regen_medium, regen_high]
    readable: true
    safety_gated: true

  # ---------------------------------- INFOTAINMENT / KẾT NỐI
  volume:
    type: volume
    zones: [all, va, call, ring, media, navigation, chime]
    default_zone: all
    value: { default_unit: level, units: { level: { lo: 0, hi: 40, nudge: 2, comfort_default: 12 } } }
    readable: true

  screen_brightness:
    type: screen_brightness
    names: { vi: ["độ sáng màn hình", "độ sáng màn hình trung tâm", "độ sáng màn hình giải trí"] }
    value: { default_unit: percent, units: { percent: { lo: 1, hi: 100, nudge: 20, comfort_default: 60 } } }
    readable: true

  hud:
    type: hud
    value: { default_unit: percent, units: { percent: { lo: 0, hi: 100 } } }
    default_action: turn_on
    support: false

  wifi:
    type: wifi
    default_action: turn_on
    readable: true

  wifi_hotspot:
    type: wifi_hotspot
    names: { vi: ["điểm phát wifi", "phát wifi", "wifi hotspot"] }
    default_action: turn_on
    readable: true

  bluetooth:
    type: bluetooth
    default_action: turn_on
    readable: true

  # ---------------------------------- QUERY-ONLY
  tire_pressure:
    type: tire_pressure
    support: false
    query_only: true

  # ---------------------------------- APP / MÀN HÌNH (list_selector)
  app_control:
    type: app_control
    names: { vi: ["ứng dụng", "app"] }
    value: { kind: item }
    items:
      music: { vi: ["âm nhạc", "nhạc", "music", "nhạc usb", "ứng dụng nhạc"] }
      radio: { vi: ["đài", "radio", "phát thanh"] }
