      # là map cướp mất, vì nó đứng trước.
      map: { vi: ["bản đồ", "here map", "map", "ứng dụng bản đồ"] }
      battery_charging: { vi: ["pin và sạc", "pin", "sạc", "battery", "battery charging",
                               "quản lý pin", "quản lý pin và sạc", "màn hình pin", "giao diện pin"] }
