# Bộ câu cho TẦNG [2] — câu mà tầng edge cố tình không bắt được.
# Chạy thật, tốn tiền, nên mặc định bị bỏ qua. Bật bằng:  AGENTCAR_LIVE=1 pytest
#
# Mục đích chính: giữ CHIỀU của lệnh. Loại lỗi này tầng [3][4] không bắt được vì
