# Câu KHÔNG được sinh ra lệnh nào.
#
# Vì sao cần tập này: 144 câu golden đều hỏi "câu này phải ra lệnh gì", nên chỉ đo
# được ĐỘ PHỦ. Không có gì đo ĐỘ CHÍNH XÁC — tỉ lệ ra lệnh oan. Mà trong xe, ra
# lệnh oan tệ hơn không hiểu nhiều: không hiểu thì người ta nói lại, ra lệnh oan
# thì cửa kính tự hạ giữa đường.
#
# "Không ra lệnh" KHÔNG có nghĩa phải im: trả lời bằng lời, hỏi lại, hay chuyển
# tầng trên đều được. Chỉ không được có lệnh nào trong plan.

