# ---------------------------------------------------------------- vùng không suy ra duy nhất
# M18. Chỉ nghe được VÙNG chứ không nghe ra thiết bị. "phía trước" thuộc cả fan,
# defrost và fog_light; "phía sau" thì gần chục thiết bị. Trước đây thứ tự chèn
# alias quyết định, nên "mở chỗ để đồ phía trước" (ý là cốp trước) ra thành bật
# quạt — sai mà vẫn chạy luôn, kiểu tệ nhất. Phát hiện khi đối chiếu
# stress_test_gpt_v2.jsonl.
- "mở chỗ để đồ phía trước"
- "bật phía sau"
- "tắt phía trước đi"
- "mo cho de do phia truoc"

# ---------------------------------------------------------------- động từ yếu
# M20. "để" là alias của set_level ("để 22 độ"), nhưng phần lớn thời gian nó là
# liên từ mục đích hoặc nằm trong danh từ ghép. Trong 500 câu stress nó xuất hiện
# 41 lần, không lần nào trước một con số.
- "cái chỗ để đồ phía trước ấy, mở nó ra giùm tôi"
- "để mình xem đã"
- "để tôi nghĩ đã"
