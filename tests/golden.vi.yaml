- { say: "mở cốp thôi",                                expect: { verdict: OK, device: trunk, action: open } }
- { say: "tắt đèn viền thôi",                          expect: { verdict: OK, device: ambient_light, action: turn_off } }
- { say: "bật điều hòa đi thôi",                       expect: { verdict: OK, device: hvac, action: turn_on, value: 22 } }

# ---------------------------------------------------------------- hư từ khi MẤT DẤU (M16)
# Mọi tập hư từ (từ nối, giới từ đích, từ sửa ý, từ hỏi) trước đây so chuỗi CÓ DẤU,
# nên câu ASR mất dấu đi qua hết: "len" không khớp "lên", "voi" không khớp "với",
# "nham" không khớp "nhầm".
- { say: "tang dieu hoa len 24 do",            expect: { verdict: OK, device: hvac, action: set_level, value: 24 } }
- { say: "tang dieu hoa len 24 do a nham 26 do", expect: { verdict: OK, device: hvac, action: set_level, value: 26 } }
- { say: "bat dieu hoa 24 do a khong 22 thoi", expect: { verdict: OK, device: hvac, action: set_level, value: 22 } }
- { say: "dieu hoa may do roi",                expect: { verdict: OK, device: hvac, action: query } }
- { say: "mo cua kinh di nao",                 expect: { verdict: OK, device: window, action: open } }
- say: "tat den vien voi ca den tran"
  expect:
    verdict: OK
    commands:
      - { device: ambient_light, action: turn_off }
      - { device: dome_light, action: turn_off }
# "máy" bỏ dấu thành "may", trùng "mấy" — không được biến câu lệnh thành câu hỏi
- { say: "bật máy lạnh lên 26 độ",             expect: { verdict: OK, device: hvac, action: set_level, value: 26 } }
- { say: "bat may lanh len 26 do",             expect: { verdict: OK, device: hvac, action: set_level, value: 26 } }

# ---------------------------------------------------------------- MẤT DẤU trộn lẫn
# Lớp này soạn sau khi bạn gõ "tang dieu hoa len 24 do à nhầm 26" — câu thật trộn
# mất dấu + hư từ + sửa ý cùng lúc, thứ 284 case cũ không có.
# mất dấu + sửa ý
- { say: "bat suoi ghe lai muc 3 a nham muc 2",    expect: { verdict: OK, device: seat_heating, action: set_level, value: 2, zone: driver } }
- { say: "mo cua kinh a thoi dong lai",            expect: { verdict: OK, device: window, action: close } }
- { say: "den vien mau do a khong mau xanh duong", expect: { verdict: OK, device: ambient_light, mode: amb_blue } }
- { say: "am luong 30 a lon 20",                   expect: { verdict: OK, device: volume, action: set_level, value: 20 } }
# mất dấu + nhiều lệnh
- say: "bat dieu hoa roi mo nhac len"
  expect: { verdict: OK, commands: [{ device: hvac }, { device: app_control }] }
- say: "tat den vien kem den tran"
  expect: { verdict: OK, commands: [{ device: ambient_light, action: turn_off }, { device: dome_light, action: turn_off }] }
- say: "mo cua kinh voi cua so troi"
  expect: { verdict: OK, commands: [{ device: window, action: open }, { device: sunroof, action: open }] }
# mất dấu + số đọc bằng chữ
- { say: "bat dieu hoa hai muoi sau do", expect: { verdict: OK, device: hvac, action: set_level, value: 26 } }
- { say: "suoi ghe lai muc hai",         expect: { verdict: OK, device: seat_heating, value: 2, zone: driver } }
# mất dấu + câu hỏi
- { say: "dieu hoa bat chua",       expect: { verdict: OK, device: hvac, action: query } }
- { say: "suoi ghe dang muc may",   expect: { verdict: OK, device: seat_heating, action: query } }
- { say: "dang mo app gi",          expect: { verdict: OK, device: app_control, action: query } }
# mất dấu + giục (KHÔNG phải câu hỏi)
- { say: "bat dieu hoa len nao",    expect: { verdict: OK, device: hvac, action: turn_on } }
# mất dấu + vùng
- { say: "suoi ghe sau ben trai muc 2", expect: { verdict: OK, device: seat_heating, zone: rear_left, value: 2 } }
- { say: "tat den suong mu truoc",      expect: { verdict: OK, device: fog_light, action: turn_off, zone: front } }
- { say: "tang am luong nhac",          expect: { verdict: OK, device: volume, action: increase, zone: media } }
# mất dấu + lệnh lẫn trong câu dài
- { say: "hom nay tac duong kinh khung ma troi nong nen bat dieu hoa 22 do di", expect: { verdict: OK, device: hvac, action: set_level, value: 22 } }
- { say: "cai quat o nha hong roi thoi mo cua kinh ra di", expect: { verdict: OK, device: window, action: open } }
# mất dấu + nói tắt
- { say: "giam 2 do",   context: ["bat dieu hoa"], expect: { verdict: OK, device: hvac, action: decrease } }
- { say: "mat hon nua", context: ["bat dieu hoa"], expect: { verdict: OK, device: hvac, action: decrease } }

# ---------------------------------------------------------------- bẫy dấu ở TẦNG SỐ
# "nhăm" (số 5 trong "hai mươi nhăm") bỏ dấu trùng "nhầm" (sửa ý);
# "một" (số 1) bỏ dấu trùng "mốt" (dạng kết hợp). Cùng họ bẫy máy/mấy, đỏ/độ.
- { say: "bật điều hòa hai mươi nhăm độ", expect: { verdict: OK, device: hvac, action: set_level, value: 25 } }
- { say: "bật điều hòa hai mươi mốt độ",  expect: { verdict: OK, device: hvac, action: set_level, value: 21 } }
- { say: "bật điều hòa hai mươi tư độ",   expect: { verdict: OK, device: hvac, action: set_level, value: 24 } }
- { say: "âm lượng mười lăm",             expect: { verdict: OK, device: volume, action: set_level, value: 15 } }
# "nhầm"/"lăm"/"tư" đứng một mình KHÔNG phải số
- { say: "điều hòa nhầm rồi",             expect: { verdict: OK, device: hvac, action: turn_on, value: 22 } }
- { say: "bật sưởi ghế nhầm",             expect: { verdict: OK, device: seat_heating, action: turn_on } }

